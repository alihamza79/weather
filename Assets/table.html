<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast Table</title>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .table-container {
            background-color: #16213e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            color: #e0e0e0;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #0f3460;
        }
        th {
            background-color: #0f3460;
            color: #4ecca3;
            font-weight: bold;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .controls button {
            background-color: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: background-color 0.3s ease;
        }
        .controls button:hover {
            background-color: #45b393;
        }
        #pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        #pagination-controls button {
            background-color: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 5px;
        }
        #page-info {
            margin: 0 10px;
            color: #e0e0e0;
        }
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 26, 46, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #4ecca3;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <!-- Add this right after the opening <body> tag -->
    <div id="loader" class="loader" style="display: none;">Loading...</div>

    <!-- Sidebar -->
    <div class="sidebar">
        <nav>
            <ul>
                <li><a href="../index.html" id="dashboard-btn">Dashboard</a></li>
                <li><a href="table.html" id="tables-btn">Tables</a></li>
            </ul>
        </nav>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <!-- Header -->
        <header>
            <h1>Weather Forecast Table</h1>
        </header>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" id="city-input" placeholder="Enter City Name">
            <button id="search-btn">Search</button>
        </div>

        <!-- Table Widget -->
        <div class="table-container">
            <h2>5-Day Weather Forecast</h2>
            <div class="controls">
                <button id="sort-asc">Sort by Temperature (Ascending)</button>
                <button id="sort-desc">Sort by Temperature (Descending)</button>
                <button id="filter-rain">Show Only Rainy Days</button>
                <button id="highest-temp">Show Day with Highest Temperature</button>
            </div>
            <table id="weather-table">
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Temperature (°C)</th>
                        <th>Humidity (%)</th>
                        <th>Wind Speed (m/s)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div id="pagination-controls">
                <button id="prev-page">Previous</button>
                <span id="page-info">Page 1</span>
                <button id="next-page">Next</button>
            </div>
        </div>
    </div>

    <script src="../JS/table.js"></script>
</body>
</html>
